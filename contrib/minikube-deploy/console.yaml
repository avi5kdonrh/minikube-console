# In-cluster deployment of the OpenShift console + networking-console-plugin for
# minikube. Applied by contrib/minikube-deploy/deploy.sh (which also builds the
# two images into minikube's container runtime and sets the Route host).
#
# Access, two ways:
#   * Route (preferred):  http://console.<minikube-ip>.nip.io  — works because
#     this cluster runs an OpenShift ingress-router (ns openshift-ingress) that
#     admits route.openshift.io Routes. If you don't have that router, the Route
#     won't serve traffic; use the NodePort instead.
#   * NodePort Service:   minikube service console -n console --url
---
apiVersion: v1
kind: Namespace
metadata:
  name: console
---
# The user-settings feature writes ConfigMap/Role/RoleBinding here. The OpenShift
# operator creates this namespace on a real cluster; on minikube we create it.
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-console-user-settings
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: console
  namespace: console
---
# Dev-grade permissions: with --user-auth=disabled the console proxies every
# request to the API server as this SA, so it needs broad access. cluster-admin
# matches the off-cluster dev setup (kube-system:console -> cluster-admin).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: console-deploy-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: console
    namespace: console
---
# Long-lived (non-expiring) token for the console SA. bridge with
# --user-auth=disabled REQUIRES a static bearer token for the k8s proxy
# (cmd/bridge/config/auth/authoptions.go: no token -> no authenticator -> proxied
# calls are unauthenticated). A rotating projected token would expire, so we let
# the token controller populate a classic SA-token Secret and inject .data.token.
apiVersion: v1
kind: Secret
metadata:
  name: console-sa-token
  namespace: console
  annotations:
    kubernetes.io/service-account.name: console
type: kubernetes.io/service-account-token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  namespace: console
  labels:
    app: console
spec:
  replicas: 1
  selector:
    matchLabels:
      app: console
  template:
    metadata:
      labels:
        app: console
    spec:
      serviceAccountName: console
      containers:
        - name: console
          image: console:minikube
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
              name: http
          env:
            - name: BRIDGE_USER_AUTH
              value: "disabled"
            - name: BRIDGE_K8S_MODE
              value: "in-cluster"
            # Static token for the k8s proxy (see the Secret above).
            - name: BRIDGE_K8S_AUTH_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: console-sa-token
                  key: token
            # Bridge proxies plugin assets server-side, so this is an in-cluster
            # Service URL. The key MUST match the plugin-manifest.json "name".
            - name: BRIDGE_PLUGINS
              value: "networking-console-plugin=http://networking-console-plugin.console.svc.cluster.local:8080"
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: console
  namespace: console
  labels:
    app: console
spec:
  type: NodePort
  selector:
    app: console
  ports:
    - name: http
      port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: networking-console-plugin
  namespace: console
  labels:
    app: networking-console-plugin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: networking-console-plugin
  template:
    metadata:
      labels:
        app: networking-console-plugin
    spec:
      containers:
        - name: plugin
          image: networking-console-plugin:minikube
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /plugin-manifest.json
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: networking-console-plugin
  namespace: console
  labels:
    app: networking-console-plugin
spec:
  selector:
    app: networking-console-plugin
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# Exposes the console via the OpenShift ingress-router running on this cluster
# (ns openshift-ingress, routerName "public"). deploy.sh sets spec.host to
# console.<minikube-ip>.nip.io, which the router admits and serves. If a cluster
# has no such router, this Route is inert — use the NodePort Service instead.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: console
  namespace: console
  labels:
    app: console
spec:
  to:
    kind: Service
    name: console
    weight: 100
  port:
    targetPort: http
  wildcardPolicy: None
