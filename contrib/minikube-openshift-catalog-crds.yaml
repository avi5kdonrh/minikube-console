# Makes the Software Catalog's "Operators" provider work on a native Kubernetes
# cluster (minikube) that has OLM installed but lacks the OpenShift API server.
#
#   kubectl apply -f contrib/minikube-openshift-catalog-crds.yaml
#
# WHY THIS IS NEEDED
# ------------------
# The dev/software catalog's "Operators" items come from the OLM provider
# `useOperatorCatalogItems` (packages/operator-lifecycle-manager). That hook
# aggregates SIX resources and, if ANY of them fails to load, it returns an
# empty list and the catalog shows:
#
#   "Operators content is not available in the catalog at this time due to
#    loading failures."
#
# The six are: OperatorGroups, PackageManifests, Subscriptions,
# ClusterServiceVersions, Infrastructure, and Authentication. On minikube+OLM
# the first four work, but the last two are OpenShift-only config.openshift.io
# singletons named "cluster" (watched by useClusterInfrastructureConfig /
# useClusterAuthenticationConfig). Without them the watches 404, poisoning the
# provider's loadError -> the banner above, even though ~150 PackageManifests
# are available from the operatorhubio CatalogSource.
#
# Creating permissive CRDs AND a "cluster" instance of each (a missing named
# instance 404s just like a missing CRD) lets both watches succeed. The catalog
# then populates from PackageManifests. The empty spec/status is safe: the only
# code that reads these objects (isAWSSTSCluster / isAzureWIFCluster /
# isGCPWIFCluster) also checks a CloudCredential singleton that doesn't exist
# here, so those checks short-circuit to false regardless of these values.
#
# NOTE: This does not make the dedicated OperatorHub install flow OpenShift-
# complete; it unblocks catalog *discovery*. Installing still works via OLM
# Subscriptions the same way it does today.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: infrastructures.config.openshift.io
spec:
  group: config.openshift.io
  scope: Cluster
  names:
    plural: infrastructures
    singular: infrastructure
    kind: Infrastructure
    listKind: InfrastructureList
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: authentications.config.openshift.io
spec:
  group: config.openshift.io
  scope: Cluster
  names:
    plural: authentications
    singular: authentication
    kind: Authentication
    listKind: AuthenticationList
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
---
apiVersion: config.openshift.io/v1
kind: Infrastructure
metadata:
  name: cluster
spec: {}
status:
  platform: None
  platformStatus:
    type: None
---
apiVersion: config.openshift.io/v1
kind: Authentication
metadata:
  name: cluster
spec:
  serviceAccountIssuer: ""
